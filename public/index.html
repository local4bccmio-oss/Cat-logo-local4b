:root{--bg:#eef0f3;--card:#fff;--ink:#14171c;--mute:#5d6572;--line:#d9dde3;--accent:#2446e6;--accent-ink:#fff;--chip:#e2e6ec;--shadow:0 1px 2px rgba(20,23,28,.08);

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101216;--card:#1a1d23;--ink:#eceef2;--mute:#9aa2af;--line:#2b3039;--accent:#7b93ff;--accent-ink:#0d1020;--chip:#262a33;--shadow:none;color-scheme:dark}}

body{background:var(--bg);color:var(--ink);font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
*{box-sizing:border-box}
.wrap{max-width:1180px;margin:0 auto}
header{padding-block:22px 12px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;justify-content:space-between}
h1{font:700 clamp(30px,6vw,46px)/1 var(--display);letter-spacing:.01em;margin:0;text-transform:uppercase}
header p{margin:0;color:var(--mute);font-size:14px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;border-bottom:1px solid var(--line);display:grid;gap:8px}

.nm{font:700 20px/1.05 var(--display);text-transform:uppercase;overflow-wrap:anywhere}
.meta{font-size:12.5px;color:var(--mute);overflow-wrap:anywhere}
.col{font-size:13px}
.code{font:500 11px var(--body);color:var(--mute);letter-spacing:.03em}

.add[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
[hidden]{display:none!important}

.empty{padding:48px 0;text-align:center;color:var(--mute)}
.dock{position:fixed;left:0;right:0;bottom:0;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));background:var(--card);border-top:1px solid var(--line);z-index:6}
.dock .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.dock b{font:700 18px var(--display)}

.btn.alt{background:var(--chip);color:var(--ink)}

.panel{background:var(--card);width:100%;max-width:640px;max-height:82vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.panel h2{margin:0 0 10px;font:700 26px var(--display);text-transform:uppercase}

.li span{min-width:0;overflow-wrap:anywhere}
.x{border:0;background:var(--chip);color:var(--ink);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tot{margin-top:12px;font-weight:700}

.lb .pic{width:min(92vw,calc(86vh*.8),520px);aspect-ratio:4/5;background-repeat:no-repeat;border-radius:8px}
.lb .cap{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#fff;font-size:14px}
.sz{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.sz .chip{padding:6px 10px}.sz .chip em{font-style:normal;margin-left:6px;font-weight:700}.li .top{display:flex;justify-content:space-between;gap:10px;align-items:start}.li .need{font-size:12px;color:var(--mute);margin-top:4px}.qty{display:inline-flex;align-items:center;gap:6px}.qty button{border:0;background:var(--chip);color:var(--ink);width:26px;height:26px;border-radius:50%;cursor:pointer;font-weight:700}.qty span{min-width:16px;text-align:center;font-weight:700}.nota{width:100%;min-height:84px;margin-top:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:400 15px var(--body);resize:vertical}.nl{display:block;margin-top:14px;font:700 14px var(--body)}.note{font-size:12px;color:var(--mute);margin-top:10px}
