<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catálogo zapatillas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: sticky filter bar over a dense photo grid; order list as a bottom sheet. Look: plain warehouse price list, ink on cool grey, one cobalt accent. */
:root{--bg:#eef0f3;--card:#fff;--ink:#14171c;--mute:#5d6572;--line:#d9dde3;--accent:#2446e6;--accent-ink:#fff;--chip:#e2e6ec;--shadow:0 1px 2px rgba(20,23,28,.08);
--display:"Barlow Condensed","Arial Narrow",sans-serif;--body:"DM Sans",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101216;--card:#1a1d23;--ink:#eceef2;--mute:#9aa2af;--line:#2b3039;--accent:#7b93ff;--accent-ink:#0d1020;--chip:#262a33;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101216;--card:#1a1d23;--ink:#eceef2;--mute:#9aa2af;--line:#2b3039;--accent:#7b93ff;--accent-ink:#0d1020;--chip:#262a33;--shadow:none;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
*{box-sizing:border-box}
.wrap{max-width:1180px;margin:0 auto}
header{padding-block:22px 12px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;justify-content:space-between}
h1{font:700 clamp(30px,6vw,46px)/1 var(--display);letter-spacing:.01em;margin:0;text-transform:uppercase}
header p{margin:0;color:var(--mute);font-size:14px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;border-bottom:1px solid var(--line);display:grid;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.row{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--chip);color:var(--ink);font:500 13px var(--body);padding:7px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.chip small{opacity:.7;margin-left:4px}
.lbl{flex:none;align-self:center;font:600 12px var(--body);color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
#q{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:10px 12px;font:400 15px var(--body)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.count{color:var(--mute);font-size:13px;padding-block:12px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.ph{aspect-ratio:4/5;width:100%;background-repeat:no-repeat;cursor:zoom-in;background-color:var(--chip);border:0;padding:0}
.info{padding:10px 10px 12px;display:grid;gap:3px;min-width:0}
.nm{font:700 20px/1.05 var(--display);text-transform:uppercase;overflow-wrap:anywhere}
.meta{font-size:12.5px;color:var(--mute);overflow-wrap:anywhere}
.col{font-size:13px}
.code{font:500 11px var(--body);color:var(--mute);letter-spacing:.03em}
.add{margin-top:6px;border:1px solid var(--accent);background:transparent;color:var(--accent);font:700 13px var(--body);padding:8px;border-radius:8px;cursor:pointer}
.add[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
[hidden]{display:none!important}
.dt{font-size:12px;color:#6b7280;margin-top:2px}.ag{font-size:12px;font-weight:700;color:#b45309;margin-top:2px}.cj{font-size:12px;font-weight:600;color:#0a7a3d;margin-top:2px}
.more{display:block;margin:20px auto 0;padding:12px 26px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 14px var(--body);cursor:pointer}
.empty{padding:48px 0;text-align:center;color:var(--mute)}
.dock{position:fixed;left:0;right:0;bottom:0;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));background:var(--card);border-top:1px solid var(--line);z-index:6}
.dock .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.dock b{font:700 18px var(--display)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font:700 14px var(--body);padding:11px 18px;border-radius:8px;cursor:pointer}
.btn.alt{background:var(--chip);color:var(--ink)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,12,16,.55);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--card);width:100%;max-width:640px;max-height:82vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.panel h2{margin:0 0 10px;font:700 26px var(--display);text-transform:uppercase}
.li{display:block;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.li span{min-width:0;overflow-wrap:anywhere}
.x{border:0;background:var(--chip);color:var(--ink);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tot{margin-top:12px;font-weight:700}
.lb{position:fixed;inset:0;z-index:30;background:rgba(10,12,16,.82);display:flex;align-items:center;justify-content:center;padding:16px}
.lb .pic{width:min(92vw,calc(86vh*.8),520px);aspect-ratio:4/5;background-repeat:no-repeat;border-radius:8px}
.lb .dl{position:absolute;bottom:calc(48px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#fff;color:#14171c;border:0;border-radius:999px;padding:12px 22px;font:700 15px var(--body);cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.lb .cap{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#fff;font-size:14px}
.sz{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.sz .chip{padding:6px 10px}.sz .chip em{font-style:normal;margin-left:6px;font-weight:700}.th{flex:none;width:84px;aspect-ratio:4/5;border-radius:8px;background-repeat:no-repeat;background-color:var(--chip);border:1px solid var(--line)}.li .top{display:flex;justify-content:space-between;gap:10px;align-items:start}.li .need{font-size:12px;color:var(--mute);margin-top:4px}.qty{display:inline-flex;align-items:center;gap:6px}.qty button{border:0;background:var(--chip);color:var(--ink);width:26px;height:26px;border-radius:50%;cursor:pointer;font-weight:700}.qty span{min-width:16px;text-align:center;font-weight:700}.nota{width:100%;min-height:84px;margin-top:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:400 15px var(--body);resize:vertical}.nl{display:block;margin-top:14px;font:700 14px var(--body)}.note{font-size:12px;color:var(--mute);margin-top:10px}
.qty .chip{width:auto;height:auto;min-width:0;white-space:nowrap;line-height:1.2}.qty{flex-wrap:nowrap}.inote{width:100%;box-sizing:border-box;margin-top:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:400 14px var(--body);padding:8px 10px;resize:vertical;min-height:44px}
/* tarjetas compactas (15/11) */
.info{padding:6px 7px 8px;gap:1px}
.nm{font-size:13.5px;line-height:1.1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.code{font-size:10px}.meta{font-size:10.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.col{font-size:11px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt,.ag,.cj{font-size:10px;margin-top:0;line-height:1.25}
.add{margin-top:4px;padding:6px;font-size:12px}
/* filtros en ventana */
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fbar .chip{margin:0!important;display:inline-block;font-weight:700}
#fsh .row{flex-wrap:wrap;overflow:visible;margin-bottom:12px}
#fsh .lbl{flex-basis:100%;margin:0 0 2px}
#fsh .panel{max-height:85vh}
#fsh .acts{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom,0px));background:var(--card);padding:10px 0 6px;margin-top:6px}
</style>

<header><h1>Catálogo zapatillas</h1><p>Calzado · <span id="tot"></span> modelos disponibles</p></header>
<div class="bar">
<input id="q" type="search" placeholder="Buscar por marca, modelo, color o referencia" aria-label="Buscar">

<div class="row" id="fg"></div>

<div class="row" id="fb"></div>

<div id="pb" hidden style="display:none;align-items:center;gap:12px;margin:10px 0;padding:10px;border-radius:12px;background:var(--chip)"><img id="pbi" alt="" style="width:56px;height:70px;object-fit:cover;border-radius:8px"><div style="flex:1;font-size:14px"><b>Resultados por foto</b><div id="pbs" style="color:var(--mute)"></div></div><button class="btn alt" id="pbx" type="button">Quitar</button></div>

</div>
