:root{--bg:#eef0f3;--card:#fff;--ink:#14171c;--mute:#5d6572;--line:#d9dde3;--accent:#2446e6;--accent-ink:#fff;--chip:#e2e6ec;--shadow:0 1px 2px rgba(20,23,28,.08);

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101216;--card:#1a1d23;--ink:#eceef2;--mute:#9aa2af;--line:#2b3039;--accent:#7b93ff;--accent-ink:#0d1020;--chip:#262a33;--shadow:none;color-scheme:dark}}

*{box-sizing:border-box}
.wrap{max-width:1180px;margin:0 auto}
header{padding-block:22px 12px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;justify-content:space-between}
h1{font:700 clamp(30px,6vw,46px)/1 var(--display);letter-spacing:.01em;margin:0;text-transform:uppercase}
header p{margin:0;color:var(--mute);font-size:14px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;border-bottom:1px solid var(--line);display:grid;gap:8px}

.meta{font-size:12.5px;color:var(--mute);overflow-wrap:anywhere}
.col{font-size:13px}

.more{display:block;margin:20px auto 0;padding:12px 26px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 14px var(--body);cursor:pointer}
.empty{padding:48px 0;text-align:center;color:var(--mute)}
.dock{position:fixed;left:0;right:0;bottom:0;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));background:var(--card);border-top:1px solid var(--line);z-index:6}
.dock .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.dock b{font:700 18px var(--display)}

.btn.alt{background:var(--chip);color:var(--ink)}

.panel{background:var(--card);width:100%;max-width:640px;max-height:82vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}

.li span{min-width:0;overflow-wrap:anywhere}

.lb .pic{width:min(92vw,calc(86vh*.8),520px);aspect-ratio:4/5;background-repeat:no-repeat;border-radius:8px}

 L.innerHTML=`<div class="sheet" id="sh"><div class="panel" role="dialog" aria-label="Pedido"><h2>Mi pedido</h2><div id="li"></div><div class="note">Elige las tallas que necesitas y cuántos pares de cada una.</div><label class="nl" for="nota">Nota general del pedido (opcional)</label><textarea class="nota" id="nota" placeholder="Ej: Necesito 2 de la 40, 2 de la 41, 1 de la 42 (2.40 / 2.41 / 1.42)"></textarea><div class="note">Nosotros confirmamos por WhatsApp la disponibilidad de lo que pidas.</div><div class="acts"><button class="btn" id="im">Realizar pedido</button><button class="btn alt" id="hs">Pedidos anteriores</button><button class="btn alt" id="cl">Cerrar</button></div></div></div>`;
 const li=$("#li");
 if(!order.size)li.innerHTML='<div class="empty">Todavía no agregaste modelos.</div>';
 order.forEach((s,f)=>{const d=find(f);if(!d)return;
  const r=document.createElement("div");r.className="li";
  const top=document.createElement("div");top.className="top";const t=document.createElement("span");t.textContent=code(d)+" · "+nom(d)+(d.c?" · "+d.c:"");
  const x=document.createElement("button");x.className="x";x.type="button";x.textContent="×";x.setAttribute("aria-label","Quitar");x.onclick=()=>{order.delete(f);save();dock();render();sheet()};top.append(t,x);r.appendChild(top);
  const zs=document.createElement("div");zs.className="sz";
  d.z.forEach(z=>{const q=s[z]||0;const b=document.createElement("span");b.className="qty";
   const c=document.createElement("button");c.type="button";c.className="chip";c.setAttribute("aria-pressed",String(q>0));c.textContent=z+(q>1?" ×"+q:"");
   c.onclick=()=>{s[z]=(s[z]||0)+1;save();dock();sheet()};
   b.appendChild(c);
   if(q){const m=document.createElement("button");m.type="button";m.textContent="−";m.setAttribute("aria-label","Quitar un par T"+z);m.onclick=()=>{if(s[z]>1)s[z]--;else delete s[z];save();dock();sheet()};b.appendChild(m)}
   zs.appendChild(b)});
  r.appendChild(zs);const ta=document.createElement("textarea");ta.className="inote";ta.rows=2;ta.placeholder="Nota de este modelo. Ej: 2.40/2.41/1.42";ta.value=window.__nn[f]||"";ta.oninput=()=>{window.__nn[f]=ta.value;saveNN();const w=document.querySelector("#wa");if(w)w.href="https://wa.me/?text="+encodeURIComponent(text())};r.appendChild(ta);const n=document.createElement("div");n.className="need";n.textContent=pares(s)?pares(s)+" pares":"Toca una talla para pedirla. Cada toque suma un par.";r.appendChild(n);li.appendChild(r)});
 const nta=$("#nota");nta.value=window.__nota||"";const upd=()=>{window.__nota=nta.value;try{localStorage.setItem("nota4b",nta.value)}catch(e){}void 0};nta.oninput=upd;upd();
 $("#im").onclick=async()=>{const b=$("#im");if(!order.size){b.textContent="Agrega un modelo";return}
  b.textContent="Preparando…";let fs;try{fs=await orderImages()}catch(e){b.textContent="Realizar pedido";return}
  try{if(navigator.canShare&&navigator.canShare({files:fs})){await navigator.share({files:fs,text:"Hola, quiero este pedido"});b.textContent="Pedido enviado";finish(1000)}
   else{fs.forEach((f,i)=>{const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);setTimeout(()=>{a.click();a.remove()},i*400)});b.textContent="Imágenes guardadas: envíalas por WhatsApp";finish(fs.length*400+2500)}}
  catch(e){b.textContent="Realizar pedido"}};
 $("#hs").onclick=hist;

 $("#cl").onclick=()=>L.innerHTML="";$("#sh").onclick=e=>{if(e.target.id==="sh")L.innerHTML=""}}
function lightbox(d){const L=$("#layer");L.innerHTML=`<div class="lb" id="lb"><div class="pic" style="${pos(d)}"></div><div class="cap"></div></div>`;
 $("#lb .cap").textContent=nom(d)+" · tallas "+tl(d);$("#lb").onclick=()=>L.innerHTML=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#layer").innerHTML=""});
$("#q").oninput=e=>{st.q=e.target.value.trim().toLowerCase();st.n=48;render()};
$("#more").onclick=()=>{st.n+=48;render()};
$("#open").onclick=sheet;
$("#tot").textContent=D.length;dock();render();
</script>
