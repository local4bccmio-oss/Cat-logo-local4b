<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buscar por foto · Catálogo</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--ink:#1c1c1c;--mut:#6b6b6b;--acc:#128c4a;--line:#e4e4e0}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#1e1e1e;--ink:#f1f1f1;--mut:#a0a0a0;--acc:#34c27a;--line:#2e2e2e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
header a{color:var(--acc);text-decoration:none;font-size:14px}
h1{font-size:18px;margin:0;flex:1}
main{max-width:980px;margin:0 auto;padding:16px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;background:var(--card)}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
button,label.b{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:16px;cursor:pointer;display:inline-block}
label.b.alt{background:transparent;color:var(--acc);border:1px solid var(--acc)}
input[type=file]{display:none}
#st{color:var(--mut);font-size:14px;margin:10px 0;min-height:20px}
#q{display:none;margin:14px 0;gap:12px;align-items:center}
#q img{width:96px;height:120px;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px}
.ph{width:100%;aspect-ratio:4/5;background-color:#fff;background-repeat:no-repeat}
.card div.t{padding:8px}
.card b{display:block;font-size:14px}
.mut{color:var(--mut)}
.pill{display:inline-block;font-size:11px;padding:1px 6px;border-radius:99px;background:var(--line);margin-top:3px}
</style>
</head>
<body>
<header><h1>Buscar por foto</h1><a href="/">← Catálogo</a></header>
<main>
<div class="drop">
  <div>Sube una foto del zapato que buscas y te mostramos los más parecidos del catálogo.</div>
  <div class="btns">
    <label class="b">📷 Tomar o elegir foto<input id="f" type="file" accept="image/*"></label>
  </div>
</div>
<div id="st">Preparando…</div>
<div id="q"><img id="qi" alt=""><div class="mut">Tu foto</div></div>
<div id="res" class="grid"></div>
</main>
<script type="module">
const $=s=>document.querySelector(s);
const st=t=>$('#st').textContent=t;
let D,V,N,K,mean,sess,ort,pending=null,CV,cmean,row;const CW=0.3;
const S=256;
async function init(){
  try{
    st('Cargando catálogo…');
    const t=await (await fetch('/?_='+Date.now())).text();
    D=JSON.parse(t.match(/const D=(\[.*?\]);\n/s)[1]);
    const meta=await (await fetch('huellas.json?_='+Date.now())).json();
    K=meta.k;N=meta.n;
    V=new Int8Array(await (await fetch('huellas.bin?_='+Date.now())).arrayBuffer());
    mean=new Float32Array(await (await fetch('mean.bin?_='+Date.now())).arrayBuffer());
    CV=new Int8Array(await (await fetch('color.bin?_='+Date.now())).arrayBuffer());
    cmean=new Float32Array(await (await fetch('colormean.bin?_='+Date.now())).arrayBuffer());
    const pos=new Map(meta.f.map((f,i)=>[f,i]));row=D.map(d=>pos.has(d.f)?pos.get(d.f):-1);
    st('Cargando el buscador de imágenes (la primera vez tarda, ~46 MB)…');
    ort=await import('https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.mjs');
    ort.env.wasm.wasmPaths='https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/';
    const p0=new Uint8Array(await (await fetch('m/mc2.part0')).arrayBuffer()),p1=new Uint8Array(await (await fetch('m/mc2.part1')).arrayBuffer());
    const m=new Uint8Array(p0.length+p1.length);m.set(p0);m.set(p1,p0.length);
    sess=await ort.InferenceSession.create(m.buffer,{executionProviders:['wasm']});
    st('Listo. Sube una foto.');
    if(pending){const f=pending;pending=null;search(f)}
  }catch(e){st('No se pudo cargar el buscador: '+e.message);console.error(e)}
}
function crop(im){ // foco en la zona del zapato (igual que el catálogo): x .1-.9, y .3-.92, cuadrado con fondo blanco
  const W=im.naturalWidth,H=im.naturalHeight;
  const sx=.1*W,sy=.3*H,sw=.8*W,sh=.62*H,m=Math.max(sw,sh);
  const c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,S,S);const k=S/m;
  g.drawImage(im,sx,sy,sw,sh,(S-sw*k)/2,(S-sh*k)/2,sw*k,sh*k);return c}
function chist(im){ // histograma de color (4x4x4) de la zona central del zapato
  const W=im.naturalWidth,H=im.naturalHeight,c=document.createElement('canvas');c.width=c.height=48;const g=c.getContext('2d');
  g.drawImage(im,.2*W,.4*H,.6*W,.45*H,0,0,48,48);const d=g.getImageData(0,0,48,48).data,h=new Float32Array(64);
  for(let i=0;i<48*48;i++)h[(d[i*4]>>6)*16+(d[i*4+1]>>6)*4+(d[i*4+2]>>6)]++;
  let n=0;for(let j=0;j<64;j++){h[j]=Math.sqrt(h[j]/2304);n+=h[j]*h[j]}n=Math.sqrt(n)||1;
  let m=0;for(let j=0;j<64;j++){h[j]=h[j]/n-cmean[j];m+=h[j]*h[j]}m=Math.sqrt(m)||1;for(let j=0;j<64;j++)h[j]/=m;return h}
async function embed(c){
  const d=c.getContext('2d').getImageData(0,0,S,S).data,a=new Float32Array(3*S*S),n=S*S;
  for(let i=0;i<n;i++){a[i]=d[i*4]/255;a[n+i]=d[i*4+1]/255;a[2*n+i]=d[i*4+2]/255}
  const r=await sess.run({x:new ort.Tensor('float32',a,[1,3,S,S])});
  const v=Float32Array.from(r[sess.outputNames[0]].data);let s=0;for(let j=0;j<K;j++)s+=v[j]*v[j];s=Math.sqrt(s)||1;for(let j=0;j<K;j++)v[j]/=s;return v}
async function search(file){
  const url=URL.createObjectURL(file);
  $('#qi').src=url;$('#q').style.display='flex';
  if(!sess){pending=file;st('Foto recibida. Terminando de cargar el buscador, espera un momento…');return}
  try{
  st('Buscando…');
  const im=new Image();im.src=url;await im.decode();
  const q=await embed(crop(im));let nq=0;for(let j=0;j<K;j++){q[j]-=mean[j];nq+=q[j]*q[j]}nq=Math.sqrt(nq)||1;for(let j=0;j<K;j++)q[j]/=nq;
  const qc=chist(im);
  const sims=new Float32Array(D.length).fill(-9);
  for(let i=0;i<D.length;i++){const r=row[i];if(r<0)continue;let s=0,o=r*K;for(let j=0;j<K;j++)s+=V[o+j]*q[j];let c=0;o=r*64;for(let j=0;j<64;j++)c+=CV[o+j]*qc[j];sims[i]=s/127+CW*c/127}
  const idx=[...sims.keys()].filter(i=>!D[i].h&&row[i]>=0).sort((a,b)=>sims[b]-sims[a]).slice(0,30);
  const R=$('#res');R.innerHTML='';
  for(const i of idx){
    const d=D[i];
    const card=document.createElement('div');card.className='card';
    const ph=document.createElement('div');ph.className='ph';
    const s=String(d.s).padStart(3,'0');
    ph.style.backgroundImage=`url(s/${s}.jpg)`;
    ph.style.backgroundSize='400% 300%';
    ph.style.backgroundPosition=`${(d.i%4)*100/3}% ${Math.floor(d.i/4)*100/2}%`;
    card.appendChild(ph);
    const t=document.createElement('div');t.className='t';
    t.innerHTML=`<b></b><span class="mut"></span><div class="mut"></div><div class="mut"></div>${d.a?'<span class="pill">Posiblemente agotado</span>':''}`;
    t.children[0].textContent=d.n;t.children[1].textContent=`Ref ${d.r.join(' / ')} · ${d.b}`;
    t.children[2].textContent=d.t||'';t.children[3].textContent=d.c||'';
    card.appendChild(t);R.appendChild(card)}
  st(`Estos son los ${idx.length} más parecidos.`);
  }catch(e){st('Error al buscar: '+e.message)}
}
$('#f').addEventListener('change',e=>{const f=e.target.files[0];if(f)search(f);e.target.value=''});
init();
</script>
</body>
</html>
