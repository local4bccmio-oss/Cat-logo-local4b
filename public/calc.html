<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calcular huellas</title>
<style>body{font:16px system-ui;margin:20px;max-width:640px}progress{width:100%;height:20px}button{font-size:18px;padding:12px 20px}#log{color:#555;white-space:pre-wrap}</style></head><body>
<h2>Calcular huellas del catálogo (CLIP)</h2>
<p>Deja esta pestaña abierta y el PC despierto hasta que termine. Al final aparece un botón para descargar.</p>
<progress id="p" value="0" max="1"></progress><div id="s">Iniciando…</div><div id="log"></div><div id="dl"></div>
<script type="module">
const $=s=>document.querySelector(s),st=t=>$('#s').textContent=t;
try{
 st('Cargando catálogo…');
 const h=await (await fetch('/?_='+Date.now())).text();
 const D=JSON.parse(h.match(/const D=(\[.*?\]);\n/s)[1]);const N=D.length;
 st('Descargando el modelo (unos 90 MB, solo la primera vez)…');
 const T=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2/+esm');
 const proc=await T.AutoProcessor.from_pretrained('Xenova/clip-vit-base-patch32');
 let model,dev='wasm';
 try{model=await T.CLIPVisionModelWithProjection.from_pretrained('Xenova/clip-vit-base-patch32',{dtype:'q8',device:'webgpu'});dev='webgpu'}catch(e){model=await T.CLIPVisionModelWithProjection.from_pretrained('Xenova/clip-vit-base-patch32',{dtype:'q8'})}
 $('#log').textContent='Modelo listo ('+dev+'). Calculando '+N+' modelos…';
 const out=new Int8Array(N*512);const imgs={};const t0=Date.now();
 const sq=document.createElement('canvas');sq.width=sq.height=525;const g=sq.getContext('2d');
 for(let n=0;n<N;n++){
  const d=D[n];if(!imgs[d.s]){const im=new Image();im.src='s/'+String(d.s).padStart(3,'0')+'.jpg';await im.decode();imgs[d.s]=im;const ks=Object.keys(imgs);if(ks.length>3)delete imgs[ks[0]]}
  g.fillStyle='#fff';g.fillRect(0,0,525,525);g.drawImage(imgs[d.s],(d.i%4)*420,Math.floor(d.i/4)*525,420,525,52,0,420,525);
  const blob=await new Promise(r=>sq.toBlob(r,'image/jpeg',.92));
  const raw=await T.RawImage.fromBlob(blob);
  const inp=await proc(raw);const {image_embeds}=await model(inp);
  const v=image_embeds.data;let nn=0;for(let j=0;j<512;j++)nn+=v[j]*v[j];nn=Math.sqrt(nn)||1;
  for(let j=0;j<512;j++)out[n*512+j]=Math.round(v[j]/nn*127);
  if(n%20==0){$('#p').value=n/N;const el=(Date.now()-t0)/1000;st(`${n} de ${N} · faltan ~${Math.round(el/(n+1)*(N-n)/60)} min`)}
 }
 $('#p').value=1;st('¡Listo! '+N+' modelos.');
 const url=URL.createObjectURL(new Blob([out.buffer]));
 $('#dl').innerHTML='<p><a id="a" download="huellas_clip.bin" href="'+url+'"><button>Descargar huellas_clip.bin</button></a></p>';
 $('#a').click();
}catch(e){st('Error: '+e.message);$('#log').textContent='Si dice que no puede descargar el modelo, esta red no llega a huggingface.co.'}
</script></body></html>
